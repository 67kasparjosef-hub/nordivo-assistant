<!doctype html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORDIVO - Reklamační asistent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: #ebe6e5; display: flex; align-items: center; justify-content: center; }
  #nordivo-root {
    --n-bg: #eef3f3;
    --n-surface: #ffffff;
    --n-ink: #17242c;
    --n-ink-soft: #566070;
    --n-line: #d7e2e1;
    --n-deep: #1c4a52;
    --n-deep-2: #123339;
    --n-accent: #3f88f8;
    --n-amber: #b0993d;
    --n-danger: #c5254a;
    --n-radius: 14px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--n-bg);
    color: var(--n-ink);
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(20,40,45,0.18);
    border: 1px solid var(--n-line);
    display: flex;
    flex-direction: column;
    height: 700px;
    max-height: 92vh;
  }
  .n-header { background: var(--n-surface); padding: 16px 18px 14px; border-bottom: 1px solid var(--n-line); display:flex; align-items:center; justify-content:space-between; }
  .n-brand { display:flex; align-items:center; gap:12px; }
  .n-logo { width:36px; height:36px; border-radius:10px; background:var(--n-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-family:"Space Grotesk"; font-weight:700; }
  .n-title { font-family:"Space Grotesk"; font-weight:700; font-size:15px; line-height:1; }
  .n-sub { font-size:11px; color:var(--n-ink-soft); margin-top:3px; }
  .n-status { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--n-ink-soft); background:var(--n-bg); border:1px solid var(--n-line); padding:6px 10px; border-radius:999px; }
  .n-dot { width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.2); }
  .n-messages { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .n-bubble { max-width:82%; padding:12px 14px; border-radius:16px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .n-bubble.user { align-self:flex-end; background:var(--n-deep); color:#fff; border-bottom-right-radius:6px; }
  .n-bubble.assistant { align-self:flex-start; background:var(--n-surface); border:1px solid var(--n-line); color:var(--n-ink); border-bottom-left-radius:6px; }
  .n-bubble.system { align-self:center; background: #fff7db; border:1px solid #f0d88a; font-size:12px; color:#6b5a1a; }
  .n-composer { padding:12px; background:var(--n-surface); border-top:1px solid var(--n-line); display:flex; gap:10px; align-items:flex-end; }
  .n-input { flex:1; min-height:44px; max-height:110px; resize:none; border:1px solid var(--n-line); background:var(--n-bg); border-radius:12px; padding:12px 14px; font-family:inherit; font-size:13.5px; outline:none; }
  .n-input:focus { border-color:var(--n-accent); background:#fff; }
  .n-send { width:44px; height:44px; border-radius:12px; border:none; background:var(--n-deep); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .n-send:disabled { opacity:.5; cursor:not-allowed; }
  .n-typing { font-size:12px; color:var(--n-ink-soft); padding:0 18px 8px; display:none; }
  .n-typing.on { display:block; }
</style>
</head>
<body>
<div id="nordivo-root">
  <div class="n-header">
    <div class="n-brand">
      <div class="n-logo">N</div>
      <div><div class="n-title">NORDIVO</div><div class="n-sub">Reklamační asistent</div></div>
    </div>
    <div class="n-status"><span class="n-dot"></span> Online</div>
  </div>
  <div class="n-messages" id="n-messages"></div>
  <div class="n-typing" id="n-typing">NORDIVO píše...</div>
  <div class="n-composer">
    <textarea id="n-input" class="n-input" placeholder="Napište zprávu..." rows="1"></textarea>
    <button id="n-send" class="n-send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>
<script>
(function(){
  const API_BASE = 'https://nordivo-assistant.vercel.app';
  const messagesEl = document.getElementById('n-messages');
  const inputEl = document.getElementById('n-input');
  const sendBtn = document.getElementById('n-send');
  const typingEl = document.getElementById('n-typing');
  let history = [];

  function addBubble(role, text){
    const div = document.createElement('div');
    div.className = 'n-bubble ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function checkHealth(){
    try {
      const res = await fetch(API_BASE + '/api/health');
      const health = await res.json();
      if (!health.apiKeyConfigured) {
        addBubble('system', '⚠️ Backend běží, ale nemá nastavený ANTHROPIC_API_KEY v .env');
      }
    } catch (err) {
      console.error('[NORDIVO] Backend health-check selhal:', err);
      addBubble('system', 'Nepodařilo se spojit s backendem. Zkontrolujte připojení.');
    }
  }

  async function sendMessage(){
    const text = inputEl.value.trim();
    if(!text) return;
    addBubble('user', text);
    history.push({role:'user', content:text});
    inputEl.value = '';
    inputEl.style.height = '44px';
    sendBtn.disabled = true;
    typingEl.classList.add('on');

    try {
      const res = await fetch(API_BASE + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      const reply = data.reply || data.message || 'Omlouvám se, nepodařilo se získat odpověď.';
      addBubble('assistant', reply);
      history.push({role:'assistant', content: reply});
    } catch (err) {
      console.error(err);
      addBubble('assistant', 'Omlouvám se, nastala chyba při spojení. Zkuste to prosím znovu.');
    } finally {
      typingEl.classList.remove('on');
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  inputEl.addEventListener('input', ()=>{
    inputEl.style.height = '44px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
  });

  // initial
  addBubble('assistant', 'Dobrý den! Jsem NORDIVO asistent. Pomohu vám s reklamací, vrácením nebo výměnou zboží. Jak vám mohu pomoci?');
  checkHealth();
})();
</script>
</body>
</html>
