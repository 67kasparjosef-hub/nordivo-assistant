<!doctype html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORDIVO — Reklamační asistent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: #dbe6e5; display: flex; align-items: center; justify-content: center; }

  #nordivo-root {
    --n-bg: #eef3f3;
    --n-surface: #ffffff;
    --n-ink: #17242c;
    --n-ink-soft: #566670;
    --n-line: #d7e2e1;
    --n-deep: #1c4a52;
    --n-deep-2: #123339;
    --n-accent: #3f8f8a;
    --n-amber: #d99a3d;
    --n-danger: #c25b4a;
    --n-radius: 14px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--n-bg);
    color: var(--n-ink);
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(20,40,45,0.18);
    border: 1px solid var(--n-line);
    display: flex;
    flex-direction: column;
    height: 700px;
    max-height: 92vh;
  }
  #nordivo-root * { box-sizing: border-box; }
  #nordivo-root .n-head {
    background: linear-gradient(160deg, var(--n-deep) 0%, var(--n-deep-2) 100%);
    color: #eef6f5;
    padding: 18px 20px 16px;
    position: relative;
    flex-shrink: 0;
  }
  #nordivo-root .n-head-top { display: flex; align-items: center; justify-content: space-between; }
  #nordivo-root .n-brand { display: flex; align-items: center; gap: 10px; }
  #nordivo-root .n-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600; font-size: 15px; letter-spacing: -0.5px;
    border: 1px solid rgba(255,255,255,0.18);
  }
  #nordivo-root .n-brand-text { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15.5px; letter-spacing: 0.2px; }
  #nordivo-root .n-brand-sub { font-size: 11px; color: #a9c9c6; margin-top: 1px; letter-spacing: 0.3px; }
  #nordivo-root .n-status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #6fd6a8;
    display: inline-block; margin-right: 5px;
    box-shadow: 0 0 0 3px rgba(111,214,168,0.18);
  }
  #nordivo-root .n-online { font-size: 11px; color: #bcd9d6; display: flex; align-items: center; margin-top: 10px; }

  #nordivo-root .n-thread {
    flex: 1; overflow-y: auto; padding: 18px 14px 6px;
    display: flex; flex-direction: column; gap: 12px;
    background:
      radial-gradient(circle at 15% 8%, rgba(63,143,138,0.06), transparent 40%),
      var(--n-bg);
  }
  #nordivo-root .n-row { display: flex; gap: 8px; align-items: flex-end; }
  #nordivo-root .n-row.user { justify-content: flex-end; }
  #nordivo-root .n-avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: var(--n-deep); color: #cfe9e6; font-size: 10.5px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    margin-bottom: 2px;
  }
  #nordivo-root .n-bubble {
    max-width: 78%; padding: 10px 13px; border-radius: var(--n-radius);
    font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
  }
  #nordivo-root .n-row.assistant .n-bubble {
    background: var(--n-surface); border: 1px solid var(--n-line);
    border-bottom-left-radius: 4px; color: var(--n-ink);
  }
  #nordivo-root .n-row.user .n-bubble {
    background: var(--n-deep); color: #f1faf9;
    border-bottom-right-radius: 4px;
  }
  #nordivo-root .n-bubble code {
    background: rgba(63,143,138,0.12); padding: 1px 5px; border-radius: 5px;
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--n-deep);
  }
  #nordivo-root .n-row.user .n-bubble code { background: rgba(255,255,255,0.15); color: #fff; }

  #nordivo-root .n-typing { display: flex; gap: 4px; padding: 4px 2px; }
  #nordivo-root .n-typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--n-accent);
    opacity: 0.4; animation: n-blink 1.1s infinite ease-in-out;
  }
  #nordivo-root .n-typing span:nth-child(2) { animation-delay: 0.15s; }
  #nordivo-root .n-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes n-blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0);} 40% { opacity: 1; transform: translateY(-3px);} }

  #nordivo-root .n-chips {
    display: flex; gap: 7px; padding: 10px 14px; overflow-x: auto;
    flex-shrink: 0; border-top: 1px solid var(--n-line); background: var(--n-surface);
  }
  #nordivo-root .n-chips::-webkit-scrollbar { display: none; }
  #nordivo-root .n-chip {
    flex-shrink: 0; font-size: 12px; padding: 7px 12px; border-radius: 20px;
    background: #eaf3f2; color: var(--n-deep); border: 1px solid var(--n-line);
    cursor: pointer; white-space: nowrap; font-weight: 500;
    transition: background 0.15s;
  }
  #nordivo-root .n-chip:hover { background: #dcece9; }
  #nordivo-root .n-chip:active { transform: scale(0.97); }

  #nordivo-root .n-inputbar {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--n-line);
    background: var(--n-surface); flex-shrink: 0;
  }
  #nordivo-root .n-inputbar textarea {
    flex: 1; resize: none; border: 1px solid var(--n-line); border-radius: 20px;
    padding: 10px 15px; font-size: 14px; font-family: inherit; line-height: 1.4;
    max-height: 90px; outline: none; color: var(--n-ink); background: var(--n-bg);
  }
  #nordivo-root .n-inputbar textarea:focus { border-color: var(--n-accent); }
  #nordivo-root .n-send {
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: var(--n-deep); color: #fff; flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }
  #nordivo-root .n-send:hover { background: var(--n-deep-2); }
  #nordivo-root .n-send:active { transform: scale(0.93); }
  #nordivo-root .n-send:disabled { background: #b7c6c4; cursor: not-allowed; }

  #nordivo-root .n-foot {
    font-size: 10px; text-align: center; color: var(--n-ink-soft);
    padding: 6px 10px 10px; background: var(--n-surface); flex-shrink: 0;
  }
  #nordivo-root .n-reset {
    background: none; border: none; color: #cfe6e3; font-size: 11px;
    cursor: pointer; text-decoration: underline; padding: 0;
  }

  @media (max-width: 500px) {
    #nordivo-root { border-radius: 0; height: 100vh; max-height: 100vh; }
    html, body { padding: 0; }
  }
</style>
</head>
<body>

<div id="nordivo-root">
  <div class="n-head">
    <div class="n-head-top">
      <div class="n-brand">
        <div class="n-mark">N.</div>
        <div>
          <div class="n-brand-text">NORDIVO</div>
          <div class="n-brand-sub">Reklamační asistent</div>
        </div>
      </div>
      <button class="n-reset" id="n-reset-btn">nový chat</button>
    </div>
    <div class="n-online"><span class="n-status-dot"></span>Asistent je online · odpovídá ihned</div>
  </div>

  <div class="n-thread" id="n-thread"></div>

  <div class="n-chips" id="n-chips">
    <div class="n-chip" data-msg="Dobrý den, chci reklamovat objednávku ORD-2026-00142.">Reklamovat objednávku</div>
    <div class="n-chip" data-msg="Jak je na tom moje reklamace REC-2026-00031?">Stav reklamace</div>
    <div class="n-chip" data-msg="Chci vrátit peníze za reklamaci REC-2026-00031.">Vrácení peněz</div>
    <div class="n-chip" data-msg="Jaká je záruční doba a co všechno mi pokrývá?">Info o záruce</div>
  </div>

  <div class="n-inputbar">
    <textarea id="n-input" rows="1" placeholder="Napište zprávu…"></textarea>
    <button class="n-send" id="n-send-btn" aria-label="Odeslat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="n-foot">Testovací asistent · údaje jsou smyšlené (e-shop NORDIVO.cz)</div>
</div>

<script>
(function() {
  const thread = document.getElementById('n-thread');
  const input = document.getElementById('n-input');
  const sendBtn = document.getElementById('n-send-btn');
  const chipsWrap = document.getElementById('n-chips');
  const resetBtn = document.getElementById('n-reset-btn');

  let history = [];

  function scrollDown() { thread.scrollTop = thread.scrollHeight; }

  function renderMarkdownLite(text) {
    let t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/`(.+?)`/g, '<code>$1</code>');
    t = t.replace(/^- (.*)$/gm, '• $1');
    return t;
  }

  function addBubble(role, text) {
    const row = document.createElement('div');
    row.className = 'n-row ' + role;
    if (role === 'assistant') {
      const av = document.createElement('div');
      av.className = 'n-avatar';
      av.textContent = 'N';
      row.appendChild(av);
    }
    const bub = document.createElement('div');
    bub.className = 'n-bubble';
    bub.innerHTML = renderMarkdownLite(text);
    row.appendChild(bub);
    thread.appendChild(row);
    scrollDown();
    return bub;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'n-row assistant';
    row.id = 'n-typing-row';
    const av = document.createElement('div');
    av.className = 'n-avatar'; av.textContent = 'N';
    row.appendChild(av);
    const bub = document.createElement('div');
    bub.className = 'n-bubble';
    bub.innerHTML = '<div class="n-typing"><span></span><span></span><span></span></div>';
    row.appendChild(bub);
    thread.appendChild(row);
    scrollDown();
  }
  function removeTyping() {
    const row = document.getElementById('n-typing-row');
    if (row) row.remove();
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    addBubble('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    autosize();
    sendBtn.disabled = true;
    addTyping();

    try {
      // Voláme VLASTNÍ backend (server/index.js), ne Anthropic přímo.
      // Backend drží API klíč v bezpečí a doplňuje data e-shopu.
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      let data;
      try {
        data = await response.json();
      } catch (parseErr) {
        // Server odpověděl, ale ne validním JSON (např. HTML chybová stránka,
        // 404, nebo špatně nakonfigurovaný proxy). Tohle NENÍ výpadek sítě.
        console.error('[NORDIVO] Odpověď serveru nešla parsovat jako JSON. Status:', response.status, response.statusText);
        throw new Error('invalid_json_response');
      }

      removeTyping();

      if (!response.ok) {
        console.error('[NORDIVO] Server vrátil chybu:', response.status, data);
      }

      const replyText = data.reply || data.error || 'Omlouvám se, teď se mi nepodařilo zprávu zpracovat.';
      addBubble('assistant', replyText);
      history.push({ role: 'assistant', content: replyText });
    } catch (err) {
      removeTyping();
      // Sem se dostaneme jen když se fetch na /api/chat vůbec nedovolal
      // (server neběží, špatný port/origin) nebo vrátil nevalidní JSON.
      console.error('[NORDIVO] Chyba spojení s backendem:', err);
      const hint = location.protocol === 'file:'
        ? ' (Stránka je otevřená přímo ze souboru — musí běžet přes server, viz http://localhost:3000.)'
        : ' Zkontrolujte, že backend (npm start) běží a konzoli prohlížeče (F12) pro detail.';
      addBubble('assistant', 'Omlouvám se, došlo k technické chybě při spojení se serverem.' + hint);
    } finally {
      sendBtn.disabled = false;
    }
  }

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 90) + 'px';
  }

  sendBtn.addEventListener('click', () => sendMessage(input.value));
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input.value);
    }
  });
  chipsWrap.addEventListener('click', (e) => {
    const chip = e.target.closest('.n-chip');
    if (chip) sendMessage(chip.getAttribute('data-msg'));
  });
  resetBtn.addEventListener('click', () => {
    history = [];
    thread.innerHTML = '';
    welcome();
  });

  function welcome() {
    addBubble('assistant', 'Dobrý den, vítejte u zákaznické podpory **NORDIVO.cz** 👋\n\nMůžu vám pomoct s reklamací, kontrolou stavu objednávky nebo vrácením zboží. Napište mi prosím **číslo objednávky nebo reklamace**, případně stačí popsat, co se s produktem děje.');
  }
  welcome();

  // Proaktivní diagnostika hned po načtení stránky — dřív, než uživatel
  // vůbec něco napíše. Odchytí nejčastější příčinu chyby spojení:
  // stránka otevřená přímo jako soubor, nebo neběžící/špatně nastavený backend.
  (async function checkBackend() {
    if (location.protocol === 'file:') {
      addBubble('assistant', '⚠️ Tato stránka je otevřená přímo ze souboru (file://). Aby chat fungoval, musí běžet přes backend server — spusťte `npm start` a otevřete **http://localhost:3000** v prohlížeči.');
      return;
    }
    try {
      const res = await fetch('/api/health');
      const health = await res.json();
      if (!health.apiKeyConfigured) {
        addBubble('assistant', '⚠️ Backend běží, ale nemá nastavený `ANTHROPIC_API_KEY` v souboru `.env`. Doplňte klíč a server restartujte (`npm start`).');
      }
    } catch (err) {
      console.error('[NORDIVO] Backend health-check selhal:', err);
      addBubble('assistant', '⚠️ Nepodařilo se spojit s backendem na `/api/health`. Zkontrolujte, že server běží (`npm start`) a že tuto stránku otevíráte na stejné adrese/portu jako backend (výchozí http://localhost:3000).');
    }
  })();
})();
</script>
</body>
</html>
