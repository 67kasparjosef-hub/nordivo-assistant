<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NORDIVO Asistent</title>
<style>
body{font-family:system-ui;background:#f5f5f5;margin:0;display:flex;justify-content:center;padding:20px}
#chat{width:100%;max-width:600px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.1);display:flex;flex-direction:column;height:600px;overflow:hidden}
#header{background:#111;color:#fff;padding:16px;font-weight:700;text-align:center}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:14px;max-width:80%;line-height:1.4;font-size:14px}
.user{background:#111;color:#fff;align-self:flex-end}
.bot{background:#f0f0f0;color:#111;align-self:flex-start}
#inputRow{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
#messageInput{flex:1;border:1px solid #ddd;border-radius:24px;padding:10px 16px}
button{background:#111;color:#fff;border:none;border-radius:24px;padding:10px 18px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div id="chat">
<div id="header">NORDIVO - Reklamní asistent</div>
<div id="messages"><div class="msg bot">Dobrý den! Zeptejte se mě na produkty - znám celý katalog.</div></div>
<div id="inputRow"><input id="messageInput" placeholder="Napište dotaz..." onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">Odeslat</button></div>
</div>
<script>
function addMessage(t,type){const m=document.getElementById('messages');const d=document.createElement('div');d.className='msg '+type;d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight}
async function sendMessage(){
const input=document.getElementById('messageInput');
const message=input.value.trim();
if(!message)return;
addMessage(message,'user');
input.value='';
try{
const urlParams = new URLSearchParams(window.location.search);
const shop = urlParams.get('shop') || '813343.myshoptet.com';
const res=await fetch('/api/chat?shop=' + shop,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({message: message, shop: shop})
});
const data=await res.json();
addMessage(data.reply||'Omlouvám se, zkuste to znovu.','bot');
}catch(e){addMessage('Chyba spojení: '+e.message,'bot')}
}
</script>
</body>
</html>
